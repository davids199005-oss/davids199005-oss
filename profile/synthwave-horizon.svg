<svg width="100%" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Synthwave horizon">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2d1b4e"/>
      <stop offset="55%" stop-color="#7b2ff7"/>
      <stop offset="80%" stop-color="#c445d4"/>
      <stop offset="100%" stop-color="#ff6b9d"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd93d"/>
      <stop offset="50%" stop-color="#ff8c42"/>
      <stop offset="100%" stop-color="#ff6b9d"/>
    </linearGradient>
    <linearGradient id="grid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ff6b9d" stop-opacity="0.9"/>
    </linearGradient>
    <clipPath id="sunclip"><rect x="0" y="0" width="900" height="130"/></clipPath>
  </defs>

  <rect width="900" height="220" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#ffffff" opacity="0.8">
    <circle cx="80" cy="30" r="1.3"/><circle cx="200" cy="55" r="1"/><circle cx="320" cy="25" r="1.4"/>
    <circle cx="480" cy="45" r="1"/><circle cx="640" cy="30" r="1.3"/><circle cx="780" cy="55" r="1"/>
    <circle cx="150" cy="80" r="1"/><circle cx="720" cy="80" r="1.2"/><circle cx="850" cy="35" r="1"/>
    <circle cx="40" cy="60" r="1"/><circle cx="560" cy="70" r="1"/><circle cx="400" cy="65" r="1.1"/>
  </g>

  <!-- sun with retro scanlines -->
  <g clip-path="url(#sunclip)">
    <circle cx="450" cy="150" r="95" fill="url(#sun)"/>
    <g stroke="#2d1b4e" stroke-width="4">
      <line x1="355" y1="112" x2="545" y2="112"/>
      <line x1="355" y1="126" x2="545" y2="126"/>
      <line x1="355" y1="139" x2="545" y2="139"/>
    </g>
  </g>

  <!-- horizon line -->
  <rect x="0" y="130" width="900" height="2" fill="#00e5ff"/>

  <!-- perspective grid -->
  <g stroke="url(#grid)" stroke-width="1.5" fill="none">
    <!-- horizontal lines getting denser toward horizon -->
    <line x1="0" y1="150" x2="900" y2="150"/>
    <line x1="0" y1="172" x2="900" y2="172"/>
    <line x1="0" y1="196" x2="900" y2="196"/>
    <line x1="0" y1="220" x2="900" y2="220"/>
    <!-- vanishing-point verticals -->
    <line x1="450" y1="132" x2="450" y2="220"/>
    <line x1="450" y1="132" x2="330" y2="220"/>
    <line x1="450" y1="132" x2="180" y2="220"/>
    <line x1="450" y1="132" x2="-40" y2="220"/>
    <line x1="450" y1="132" x2="570" y2="220"/>
    <line x1="450" y1="132" x2="720" y2="220"/>
    <line x1="450" y1="132" x2="940" y2="220"/>
  </g>
</svg>
